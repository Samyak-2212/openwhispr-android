# Project-wide Gradle settings

# JVM args for the Gradle daemon — keep lean for old machines
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel builds for multi-module
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true

# Use non-transitive R classes to reduce APK size
android.nonTransitiveRClass=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Disable Jetpack Compose (we use XML Views)
# android.defaults.buildfeatures.compose=false
